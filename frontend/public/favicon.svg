<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="32" height="32">
  <circle cx="50" cy="50" r="10" fill="#059669" />
  
  <g transform="rotate(0 50 50)">
    <ellipse cx="50" cy="50" rx="40" ry="15" fill="none" stroke="#059669" stroke-width="4" />
    <circle r="5" fill="#0f172a">
      <animateMotion dur="3s" repeatCount="indefinite" path="M 10 50 a 40 15 0 1 0 80 0 a 40 15 0 1 0 -80 0" />
    </circle>
  </g>
  
  <g transform="rotate(60 50 50)">
    <ellipse cx="50" cy="50" rx="40" ry="15" fill="none" stroke="#059669" stroke-width="4" />
    <circle r="5" fill="#0f172a">
      <animateMotion dur="3s" repeatCount="indefinite" begin="-1s" path="M 10 50 a 40 15 0 1 0 80 0 a 40 15 0 1 0 -80 0" />
    </circle>
  </g>
  
  <g transform="rotate(120 50 50)">
    <ellipse cx="50" cy="50" rx="40" ry="15" fill="none" stroke="#059669" stroke-width="4" />
    <circle r="5" fill="#0f172a">
      <animateMotion dur="3s" repeatCount="indefinite" begin="-2s" path="M 10 50 a 40 15 0 1 0 80 0 a 40 15 0 1 0 -80 0" />
    </circle>
  </g>
</svg>