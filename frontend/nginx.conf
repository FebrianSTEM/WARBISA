# 1. Redirect semua traffic HTTP (Port 80) ke HTTPS (Port 443)
server {
    listen 80;
    server_name warbisa.febriannnm.cloud;
    return 301 https://$host$request_uri;
}

# 2. Blok HTTPS Utama
server {
    listen 443 ssl;
    server_name warbisa.febriannnm.cloud;

    # Sesuaikan path sertifikat dengan domain baru
    ssl_certificate /etc/letsencrypt/live/warbisa.febriannnm.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/warbisa.febriannnm.cloud/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # SPA Fallback routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to .NET Backend Container
    location /api/v1/ {
        proxy_pass http://backend:8080/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}